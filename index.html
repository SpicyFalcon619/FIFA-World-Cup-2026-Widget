<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <title>World Cup Widget 26</title>
  </head>
  <body style="background: transparent; margin: 0; overflow: hidden;">
    <div id="root"></div>
    <script>
      window.addEventListener('error', (e) => {
        document.body.innerHTML += `<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:red;color:white;z-index:9999;padding:20px;overflow:auto;font-family:monospace;"><h3>Runtime Error</h3><pre>${e.error?.stack || e.message}</pre></div>`;
      });
      window.addEventListener('unhandledrejection', (e) => {
        document.body.innerHTML += `<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:red;color:white;z-index:9999;padding:20px;overflow:auto;font-family:monospace;"><h3>Unhandled Promise Rejection</h3><pre>${e.reason?.stack || e.reason}</pre></div>`;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
