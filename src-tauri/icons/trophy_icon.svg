<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark navy background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1408"/>
      <stop offset="100%" stop-color="#0a0b12"/>
    </radialGradient>

    <!-- Gold metallic gradient for trophy body -->
    <linearGradient id="goldMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFF8C0"/>
      <stop offset="20%"  stop-color="#F5C842"/>
      <stop offset="50%"  stop-color="#D4960A"/>
      <stop offset="75%"  stop-color="#F5B800"/>
      <stop offset="100%" stop-color="#8B5E00"/>
    </linearGradient>

    <!-- Gold side gradient -->
    <linearGradient id="goldSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6B4400"/>
      <stop offset="30%"  stop-color="#D4960A"/>
      <stop offset="60%"  stop-color="#FFF0A0"/>
      <stop offset="80%"  stop-color="#C87E00"/>
      <stop offset="100%" stop-color="#7B4D00"/>
    </linearGradient>

    <!-- Globe gradient -->
    <radialGradient id="globeGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#FFF8D0"/>
      <stop offset="40%"  stop-color="#F5C030"/>
      <stop offset="80%"  stop-color="#B87800"/>
      <stop offset="100%" stop-color="#7B5000"/>
    </radialGradient>

    <!-- Malachite green band gradient -->
    <linearGradient id="malachite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#3DAA70"/>
      <stop offset="30%"  stop-color="#1D7A45"/>
      <stop offset="60%"  stop-color="#2D9455"/>
      <stop offset="100%" stop-color="#145030"/>
    </linearGradient>

    <!-- Gold glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Trophy shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="rgba(0,0,0,0.7)"/>
    </filter>

    <!-- Ambient gold glow behind trophy -->
    <radialGradient id="glowBg" cx="50%" cy="52%" r="40%">
      <stop offset="0%"   stop-color="rgba(245,184,0,0.18)"/>
      <stop offset="100%" stop-color="rgba(245,184,0,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="60" fill="url(#bgGrad)"/>

  <!-- Subtle "26" text in background -->
  <text x="50" y="340" font-family="Arial Black, sans-serif" font-weight="900"
        font-size="260" fill="rgba(255,255,255,0.055)" text-anchor="start"
        letter-spacing="-10">26</text>

  <!-- Ambient glow behind trophy -->
  <ellipse cx="256" cy="270" rx="130" ry="160" fill="url(#glowBg)"/>

  <!-- TROPHY (centered, scaled to fit 512x512) -->
  <g filter="url(#shadow)" transform="translate(256,260) scale(1.0)">

    <!-- Globe (top) -->
    <circle cx="0" cy="-175" r="58" fill="url(#globeGrad)"/>
    <!-- Globe continent texture lines -->
    <ellipse cx="0" cy="-175" rx="58" ry="20" fill="none" stroke="rgba(180,120,0,0.35)" stroke-width="1.5"/>
    <ellipse cx="0" cy="-175" rx="40" ry="56" fill="none" stroke="rgba(180,120,0,0.25)" stroke-width="1"/>
    <ellipse cx="0" cy="-175" rx="20" ry="57" fill="none" stroke="rgba(180,120,0,0.20)" stroke-width="1"/>
    <line x1="-58" y1="-175" x2="58" y2="-175" stroke="rgba(180,120,0,0.30)" stroke-width="1"/>
    <!-- Globe shine -->
    <ellipse cx="-18" cy="-195" rx="18" ry="12" fill="rgba(255,255,255,0.30)"/>

    <!-- Left human figure arm (holding the globe) -->
    <!-- Left shoulder/arm up and to the right -->
    <path d="M -52,-155  C -85,-155 -95,-140 -88,-120  C -80,-95 -65,-85 -55,-75
             C -50,-70 -48,-62 -50,-50  C -52,-40 -55,-28 -55,-15"
          fill="none" stroke="url(#goldSide)" stroke-width="22" stroke-linecap="round"/>
    <!-- Left arm fill -->
    <path d="M -52,-155  C -85,-155 -95,-140 -88,-120  C -80,-95 -65,-85 -55,-75
             C -50,-70 -48,-62 -50,-50  C -52,-40 -55,-28 -55,-15"
          fill="none" stroke="url(#goldMain)" stroke-width="18" stroke-linecap="round" opacity="0.8"/>

    <!-- Right human figure arm -->
    <path d="M 52,-155  C 85,-155 95,-140 88,-120  C 80,-95 65,-85 55,-75
             C 50,-70 48,-62 50,-50  C 52,-40 55,-28 55,-15"
          fill="none" stroke="url(#goldSide)" stroke-width="22" stroke-linecap="round"/>
    <path d="M 52,-155  C 85,-155 95,-140 88,-120  C 80,-95 65,-85 55,-75
             C 50,-70 48,-62 50,-50  C 52,-40 55,-28 55,-15"
          fill="none" stroke="url(#goldMain)" stroke-width="18" stroke-linecap="round" opacity="0.8"/>

    <!-- Neck / body connector (below globe, above malachite) -->
    <rect x="-20" y="-118" width="40" height="38" rx="6" fill="url(#goldMain)"/>
    <!-- Narrow waist -->
    <path d="M -20,-80 Q -28,-60 -30,-42 L 30,-42 Q 28,-60 20,-80 Z"
          fill="url(#goldMain)"/>

    <!-- Malachite green band -->
    <rect x="-52" y="-48" width="104" height="34" rx="4" fill="url(#malachite)"/>
    <!-- Malachite highlight -->
    <rect x="-52" y="-48" width="104" height="10" rx="4" fill="rgba(100,220,150,0.20)"/>
    <!-- Malachite text -->
    <text x="0" y="-26" text-anchor="middle" font-family="Arial, sans-serif"
          font-size="7" font-weight="bold" fill="rgba(245,200,0,0.85)" letter-spacing="1">FIFA WORLD CUP</text>

    <!-- Stem below malachite -->
    <rect x="-28" y="-14" width="56" height="30" rx="4" fill="url(#goldMain)"/>
    <rect x="-38" y="16" width="76" height="16" rx="4" fill="url(#goldMain)"/>

    <!-- Base tier 1 (widest) -->
    <rect x="-72" y="32" width="144" height="22" rx="5" fill="url(#goldMain)"/>
    <!-- Base gold sheen -->
    <rect x="-72" y="32" width="144" height="7" rx="5" fill="rgba(255,255,220,0.25)"/>

    <!-- Base tier 2 (narrow foot) -->
    <rect x="-56" y="54" width="112" height="14" rx="4" fill="url(#goldSide)"/>

    <!-- Base bottom line -->
    <rect x="-60" y="68" width="120" height="5" rx="2" fill="rgba(180,120,0,0.6)"/>

  </g>

  <!-- Small star sparkles -->
  <circle cx="130" cy="120" r="2" fill="rgba(255,240,100,0.5)"/>
  <circle cx="385" cy="145" r="2.5" fill="rgba(255,240,100,0.4)"/>
  <circle cx="105" cy="360" r="1.5" fill="rgba(255,240,100,0.35)"/>
  <circle cx="400" cy="390" r="2" fill="rgba(255,240,100,0.45)"/>

</svg>
